name: Backend Matrix

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            experimental: false
          - backend: mysql
            experimental: true
          - backend: mariadb
            experimental: true
          - backend: clickhouse
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Install locked environment
        run: uv sync --locked
      - name: Run provider-backed suites
        env:
          DBWARDEN_HARNESS_RUN_INTEGRATION: "1"
          DBWARDEN_HARNESS_ARTIFACT_DIR: artifacts
        run: uv run pytest -m integration suites/round_trip -k "${{ matrix.backend }}" -q
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.backend }}
          path: artifacts
