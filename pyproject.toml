[project]
name = "dbwarden-test-harness"
version = "0.1.0"
description = "Black-box integration and distribution harness for dbwarden"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "dbwarden[clickhouse,mysql,postgres]>=0.19.0",
    "testcontainers>=4.10",
    "mcp>=1.6.0,<2.0",
    "sqlglot>=30.19,<30.20",
]

[tool.uv.sources]
dbwarden = { path = "../dbwarden", editable = false }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "zensical>=0.0.44",
    "seoslug>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "suites"]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]
markers = [
    "integration: requires Docker and real database providers",
    "slow: long-running durability or matrix coverage",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "tools", "infrastructure", "schemas", "mcp_server"]
